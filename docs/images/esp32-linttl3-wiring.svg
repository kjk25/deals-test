<svg xmlns="http://www.w3.org/2000/svg" width="1676" height="944" viewBox="0 0 1676 944" role="img" aria-labelledby="title desc">
  <title id="title">DEALS - ESP32 mit LINTTL3 verbinden</title>
  <desc id="desc">Anschlussbild fuer ESP32 Dev Module und LINTTL3. LIN-Bus rechts, HIN mit GND gebrueckt, gerade Kabel.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity=".55"/></filter>
    <style>
      .bg{fill:#05080b}.title{font:700 50px Arial,sans-serif;fill:#f5f5f3}.head{font:700 30px Arial,sans-serif;fill:#f2f2f0}.label{font:700 24px Arial,sans-serif;fill:#f2f2ef}.small{font:700 17px Arial,sans-serif;fill:#d9dfdd}.muted{font:700 20px Arial,sans-serif;fill:#aeb8b8}.wire{fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-width:7}.thin{stroke-width:5}.red{stroke:#ff2b28}.black{stroke:#191919}.blue{stroke:#1688ff}.green{stroke:#66d34f}.orange{stroke:#ff8b00}.yellow{stroke:#ffe000}.gray{stroke:#b9b9b9}.board{fill:#184f24;stroke:#b7aa83;stroke-width:2}.terminal{fill:#56a960;stroke:#25572c;stroke-width:2}.pin{fill:#111;stroke:#d9d0be;stroke-width:3}.pad{fill:#ded8ca;stroke:#8e8677;stroke-width:2}.chip{fill:#1b1d20;stroke:#4b4f50;stroke-width:2}.dash{fill:none;stroke:#f4f4f2;stroke-width:3;stroke-dasharray:12 12}.warn{fill:none;stroke:#ff2b28;stroke-width:3}.warnText{font:700 29px Arial,sans-serif;fill:#f6f2ee}.silk{font:700 24px Arial,sans-serif;fill:#edf7eb}.tiny{font:700 12px Arial,sans-serif;fill:#e5f0e1}
    </style>
  </defs>
  <rect class="bg" width="1676" height="944"/>
  <text class="title" x="838" y="78" text-anchor="middle">DEALS - ESP32 mit LINTTL3 verbinden</text>
  <text class="head" x="88" y="148">ESP32 DEV MODULE</text>
  <text class="head" x="838" y="148" text-anchor="middle">LINTTL3</text>
  <text class="head" x="1465" y="148" text-anchor="middle">LIN BUS</text>

  <g filter="url(#shadow)">
    <rect x="55" y="185" width="285" height="585" rx="20" fill="#101417" stroke="#b8aa85" stroke-width="2"/>
    <rect x="108" y="260" width="180" height="218" rx="7" fill="#d8d0bd" stroke="#827a69" stroke-width="3"/>
    <text x="198" y="360" text-anchor="middle" font-family="Arial,sans-serif" font-size="52" font-weight="700" fill="#777">ESP32</text>
    <text x="198" y="401" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#777">ESP-WROOM-32</text>
    <rect x="149" y="684" width="72" height="58" rx="9" fill="#d8d0bd" stroke="#777" stroke-width="3"/>
    <text class="small" x="112" y="672">EN</text><text class="small" x="260" y="672">BOOT</text>
    <g>
      <circle class="pad" cx="55" cy="222" r="10"/><circle class="pad" cx="55" cy="256" r="10"/><circle class="pad" cx="55" cy="290" r="10"/><circle class="pad" cx="55" cy="324" r="10"/><circle class="pad" cx="55" cy="358" r="10"/><circle class="pad" cx="55" cy="392" r="10"/><circle class="pad" cx="55" cy="426" r="10"/><circle class="pad" cx="55" cy="460" r="10"/><circle class="pad" cx="55" cy="494" r="10"/><circle class="pad" cx="55" cy="528" r="10"/><circle class="pad" cx="55" cy="562" r="10"/><circle class="pad" cx="55" cy="596" r="10"/><circle class="pad" cx="55" cy="630" r="10"/>
      <circle class="pad" cx="340" cy="222" r="10"/><circle class="pad" cx="340" cy="256" r="10"/><circle class="pad" cx="340" cy="290" r="10"/><circle class="pad" cx="340" cy="324" r="10"/><circle class="pad" cx="340" cy="358" r="10"/><circle class="pad" cx="340" cy="392" r="10"/><circle class="pad" cx="340" cy="426" r="10"/><circle class="pad" cx="340" cy="460" r="10"/><circle class="pad" cx="340" cy="494" r="10"/><circle class="pad" cx="340" cy="528" r="10"/><circle class="pad" cx="340" cy="562" r="10"/><circle class="pad" cx="340" cy="596" r="10"/><circle class="pad" cx="340" cy="630" r="10"/>
    </g>
  </g>

  <g filter="url(#shadow)">
    <rect class="board" x="620" y="235" width="570" height="390" rx="5"/>
    <rect class="terminal" x="620" y="265" width="88" height="330" rx="4"/>
    <rect class="terminal" x="1092" y="265" width="98" height="330" rx="4"/>
    <text class="tiny" x="905" y="276" text-anchor="middle">eletechsup</text>
    <text class="silk" x="905" y="585" text-anchor="middle">LINTTL3</text>
    <rect class="chip" x="855" y="458" width="72" height="72" rx="4"/><rect class="chip" x="958" y="355" width="88" height="65" rx="4"/><rect class="chip" x="965" y="485" width="68" height="76" rx="4"/>
    <circle class="pin" cx="660" cy="305" r="22"/><circle class="pin" cx="660" cy="385" r="22"/><circle class="pin" cx="660" cy="465" r="22"/><circle class="pin" cx="660" cy="545" r="22"/>
    <circle class="pin" cx="1140" cy="305" r="22"/><circle class="pin" cx="1140" cy="385" r="22"/><circle class="pin" cx="1140" cy="465" r="22"/><circle class="pin" cx="1140" cy="545" r="22"/>
    <text class="silk" x="690" y="313">RX</text><text class="silk" x="690" y="393">SLP</text><text class="silk" x="690" y="473">TX</text><text class="silk" x="690" y="553">GND</text>
    <text class="silk" x="1042" y="313">VIN</text><text class="silk" x="1042" y="393">HIN</text><text class="silk" x="1042" y="473">LIN</text><text class="silk" x="1042" y="553">GND</text>
  </g>

  <rect class="dash" x="1325" y="185" width="300" height="575" rx="22"/>

  <text class="label" x="392" y="291">GPIO16 (LIN TX)</text>
  <text class="label" x="392" y="371">GPIO5 (SLP)</text>
  <text class="label" x="392" y="451">GPIO17 (LIN RX)</text>
  <text class="label" x="392" y="531">GND</text>
  <path class="wire blue" d="M340 305 H660"/><path class="wire orange" d="M340 385 H660"/><path class="wire green" d="M340 465 H660"/><path class="wire black" d="M340 545 H660"/>
  <circle cx="340" cy="305" r="9" fill="#1688ff"/><circle cx="660" cy="305" r="9" fill="#1688ff"/><circle cx="340" cy="385" r="9" fill="#ff8b00"/><circle cx="660" cy="385" r="9" fill="#ff8b00"/><circle cx="340" cy="465" r="9" fill="#66d34f"/><circle cx="660" cy="465" r="9" fill="#66d34f"/><circle cx="340" cy="545" r="9" fill="#111" stroke="#777"/><circle cx="660" cy="545" r="9" fill="#111" stroke="#777"/>

  <text class="label" x="1392" y="313">+12V Versorgung</text>
  <text class="label" x="1392" y="473">LIN</text>
  <text class="label" x="1392" y="553">LIN-GND / Masse</text>
  <path class="wire red" d="M1140 305 H1364"/><path class="wire yellow" d="M1140 465 H1364"/><path class="wire gray" d="M1140 545 H1364"/>
  <circle cx="1140" cy="305" r="9" fill="#ff2b28"/><circle cx="1364" cy="305" r="11" fill="#ff2b28" stroke="#fff"/><circle cx="1140" cy="465" r="9" fill="#ffe000"/><circle cx="1364" cy="465" r="11" fill="#ffe000" stroke="#fff"/><circle cx="1140" cy="545" r="9" fill="#b9b9b9"/><circle cx="1364" cy="545" r="11" fill="#b9b9b9" stroke="#fff"/>

  <path class="wire black thin" d="M1140 385 H1220 V545 H1140"/>
  <circle cx="1140" cy="385" r="9" fill="#111" stroke="#777"/><circle cx="1140" cy="545" r="9" fill="#111" stroke="#777"/>
  <text class="muted" x="1228" y="425">HIN mit GND bruecken</text>
  <text class="muted" x="392" y="610">ESP32 per USB versorgen</text>

  <rect class="warn" x="110" y="800" width="1456" height="92" rx="14"/>
  <path d="M174 817 L217 878 H131 Z" fill="none" stroke="#ff2b28" stroke-width="6" stroke-linejoin="round"/>
  <text x="174" y="864" text-anchor="middle" font-family="Arial,sans-serif" font-size="44" font-weight="700" fill="#ff2b28">!</text>
  <text class="warnText" x="242" y="858">Nicht direkt an Fahrzeug-LIN senden - nur am Testaufbau oder mit voller Kenntnis verwenden</text>
</svg>
