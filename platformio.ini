[platformio]
default_envs = esp32dev
data_dir = data

[env:esp32dev]
platform = espressif32@6.10.0
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
lib_deps =
  links2004/WebSockets@^2.6.1
build_flags =
  -D DEALS_VERSION=\"0.1.60-TEST\"
  -D CORE_DEBUG_LEVEL=0
  -fmacro-prefix-map=${sysenv.USERPROFILE}=.
  -ffile-prefix-map=${sysenv.USERPROFILE}=.
